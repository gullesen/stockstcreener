<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StockScreener Pro v8.4</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- ✅ Grunnoppsett for linjediagram -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@2.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --text: #ffffff; --secondary: #8e8e93;
            --green: #32d74b; --red: #ff453a; --blue: #0a84ff; --orange: #ff9f0a;
            --yellow: #ffd60a;
        }
        body {
            font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text);
            margin: 0; padding: env(safe-area-inset-top) 15px 120px 15px; -webkit-tap-highlight-color: transparent;
        }
        .sticky-header { position: sticky; top: 0; background: var(--bg); padding: 10px 0; z-index: 100; transition: padding 0.2s ease; }
        .sticky-header.compact { padding: 6px 0; }
        .sticky-header.compact .header-top, .sticky-header.compact .filter-row, .sticky-header.compact .sort-row { display: none; }
        .header-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .timestamp-container { text-align: right; line-height: 1.2; }
        .update-label { font-size: 8px; color: var(--blue); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; display: block; }
        .update-time { font-size: 10px; color: var(--secondary); font-weight: 600; white-space: nowrap; }

        input, select, .sort-btn, .filter-btn, textarea {
            width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--card); color: var(--text);
            font-size: 14px; margin-bottom: 8px; box-sizing: border-box; outline: none;
        }
        .search-wrap { position: relative; margin-bottom: 8px; }
        .search-wrap input { margin-bottom: 0; padding-right: 44px; }
        .clear-search { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: none; width: 30px; height: 30px; border: none; border-radius: 50%; background: #3a3a3c; color: var(--text); font-size: 22px; line-height: 1; cursor: pointer; }
        .clear-search.visible { display: block; }
        .filter-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .filter-btn { flex: 1; font-weight: 600; }
        .active-filter { background: var(--blue) !important; }
        .sort-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 6px;
            margin-bottom: 10px;
        }
        .main-filter-control {
            display: block;
            min-width: 0;
        }
        .main-filter-label {
            display: block;
            color: var(--secondary);
            font-size: 10px;
            font-weight: 800;
            margin: 0 0 3px 2px;
        }
        .main-filter-control select {
            margin: 0;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
        .sort-select-wrap {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 30px;
            gap: 4px;
        }
        .sort-direction {
            min-width: 0;
            margin: 0;
            padding: 0;
            border: 0;
            border-radius: 12px;
            background: var(--card);
            color: var(--blue);
            cursor: pointer;
            font-size: 16px;
            font-weight: 900;
        }
        .sort-direction:focus-visible,
        .main-filter-control select:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 2px;
        }
        .filter-panel { background: var(--card); border-radius: 14px; margin: 0 0 10px; padding: 10px; }
        .filter-panel summary { cursor: pointer; color: var(--blue); font-size: 13px; font-weight: 800; }
        .filter-panel summary {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .visible-stock-count {
            color: var(--blue);
            font-size: 12px;
            font-weight: 800;
            white-space: nowrap;
        }



        .filter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }.filter-grid select, .filter-grid input { margin: 0; min-width: 0; }
        .preset-row { display: flex; gap: 7px; margin-top: 8px; }.preset-btn { flex: 1; border: 1px solid #3a3a3c; border-radius: 9px; background: transparent; color: var(--text); padding: 9px 7px; font-size: 11px; font-weight: 750; }
        .filter-note { color: var(--secondary); font-size: 10px; line-height: 1.35; margin-top: 8px; }
        .compact-signal { color:var(--secondary); font-size:10px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:4px; flex-basis:100%; order:3; }.stock-card-main { order:1; }.price { order:2; }
        @media (max-width: 430px) {
            .main-filter-label { font-size: 9px; }
            .main-filter-control select { padding: 10px 7px; font-size: 12px; }
            .sort-select-wrap { grid-template-columns: minmax(0, 1fr) 28px; gap: 3px; }
            .filter-grid { grid-template-columns: 1fr; }
            .stock-card { padding: 14px; }
            .row-indicators { gap: 5px; }
            .mini-stat .val { font-size: 12px; }
        }
        .row-top { flex-wrap: wrap; }
        .compact-signal { width: 100%; }
        .signal-summary,
        .scenario-card {
            background: var(--card);
            border: 1px solid #2c2c2e;
            border-radius: 15px;
            padding: 15px;
            margin: 0 0 18px;
        }
        .signal-summary-title {
            color: var(--secondary);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .signal-summary-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #2c2c2e;
            font-size: 13px;
        }
        .signal-summary-row:last-of-type { border-bottom: 0; }
        .signal-summary-row span:first-child { color: var(--secondary); }
        .signal-summary-row span:last-child { font-weight: 800; text-align: right; }
        .technical-average-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }
        .technical-average-cell {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 3px 8px;
            padding: 9px;
            border: 1px solid #2c2c2e;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            font-size: 12px;
        }
        .technical-average-label { color: var(--secondary); font-weight: 800; }
        .technical-average-status { font-weight: 800; text-align: right; }
        .technical-average-value {
            grid-column: 1 / -1;
            font-weight: 800;
            text-align: right;
        }
        .technical-average-column {
            display: grid;
            gap: 8px;
            min-width: 0;
        }
        .momentum-status {
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 800;
        }
        .momentum-values {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
        }
        .momentum-value {
            display: grid;
            gap: 3px;
            min-width: 0;
        }
        .momentum-value-label {
            color: var(--secondary);
            font-size: 10px;
            font-weight: 800;
            line-height: 1.15;
            overflow-wrap: anywhere;
            text-transform: uppercase;
        }
        .momentum-value-number {
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
        }
        @media (max-width: 320px) {
            .momentum-values { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .momentum-value:last-child { grid-column: 1 / -1; text-align: center; }
        }
        .scenario-card p { color: var(--secondary); line-height: 1.45; margin: 5px 0 14px; }
        .timing-good { color: var(--green); }
        .timing-possible, .timing-wait { color: var(--yellow); }
        .timing-weak { color: var(--red); }
        .timing-none { color: var(--secondary); }
        @media (max-width: 430px) {
            .signal-summary-row { grid-template-columns: 1fr; gap: 3px; }
            .signal-summary-row span:last-child { text-align: left; }
        }

        .stock-card { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
        .row-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
        .stock-card-main { flex: 1; min-width: 0; }
        .ticker { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 5px; min-width: 0; white-space: nowrap; }
        .ticker-symbol { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .price { font-size: 20px; font-weight: 700; display:flex; align-items:center; gap:10px; white-space: nowrap; flex-shrink: 0; }

        .triple-icons { display:inline-flex; gap:4px; align-items:center; }
        .signal-mini { display: inline-flex; align-items: center; gap: 2px; }
        .signal-mini-label { color: var(--secondary); font-size: 8px; font-weight: 900; }
        .sig-dot { font-size: 16px; line-height: 1; filter: saturate(1.1); }

        .list-badge { font-size: 9px; background: #3a3a3c; padding: 2px 5px; border-radius: 4px; color: var(--orange); font-weight: 900; }
        .list-badge.radar { color: var(--blue); }
        .stock-name-row { display: flex; align-items: center; gap: 5px; margin-top: 2px; min-width: 0; }
        .stock-name { color: var(--secondary); font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
        .score-badge { font-size: 10px; padding: 2px 6px; border-radius: 6px; font-weight: 800; margin-left: 6px; }
        .profit-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; font-weight: 800; margin-left: 5px;}
        .row-indicators { display: flex; justify-content: space-between; padding-top: 10px; border-top: 1px solid #2c2c2e; }
        .mini-stat { display: flex; flex-direction: column; }
        .label { font-size: 9px; color: var(--secondary); font-weight: 800; text-transform: uppercase; margin-bottom: 2px; }
        .val { font-size: 14px; font-weight: 700; }
        .info-i { color: var(--blue); font-style: normal; font-size: 11px; margin-left: 2px; }

        .detail-sticky-header {
            position: sticky;
            top: 0;
            z-index: 10;
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            margin: 0 -20px 20px;
            padding: max(10px, env(safe-area-inset-top)) 20px 10px;
            background: rgba(0, 0, 0, 0.96);
            border-bottom: 1px solid #2c2c2e;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.24);
        }
        .detail-back-button {
            min-height: 36px;
            border: 0;
            background: transparent;
            color: var(--blue);
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            padding: 6px 0;
        }
        .detail-back-button:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
        .detail-sticky-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 800; text-align: center; }
        .detail-sticky-price { color: var(--text); font-size: 14px; font-weight: 800; white-space: nowrap; }
        @media (max-width: 430px) { .detail-sticky-header { gap: 8px; } .detail-back-button { font-size: 14px; } .detail-sticky-name { font-size: 13px; } }


        #detailPage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2000;
            display: none; overflow-y: auto; padding: env(safe-area-inset-top) 20px 140px 20px; box-sizing: border-box;
        }
        #alertPage {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); z-index: 2100;
            display: none; overflow-y: auto; padding: env(safe-area-inset-top) 20px 140px 20px; box-sizing: border-box;
        }
        .detail-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { color: var(--blue); font-size: 17px; font-weight: 600; cursor: pointer; }

        .chart-section {
            background: var(--card);
            border: 1px solid #2c2c2e;
            border-radius: 18px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .chart-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 52px;
            padding: 14px 15px;
            border: 0;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            text-align: left;
        }
        .chart-toggle-meta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--blue);
            font-size: 12px;
            white-space: nowrap;
        }
        .chart-toggle:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: -3px;
        }
        #chart-content {
            padding: 0 15px 15px;
        }
        #chart-content .time-row {
            margin-bottom: 15px;
        }
        #chart-content .charts-wrapper {
            margin-bottom: 0;
        }
        .signal-history-section {
            background: var(--card);
            border: 1px solid #2c2c2e;
            border-radius: 18px;
            margin-bottom: 18px;
            overflow: hidden;
        }
        .signal-history-toggle {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 52px;
            padding: 14px 15px;
            border: 0;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font: inherit;
            font-size: 14px;
            font-weight: 800;
            text-align: left;
        }
        .signal-history-toggle-meta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--blue);
            font-size: 12px;
            white-space: nowrap;
        }
        .signal-history-toggle:focus-visible,
        .signal-history-event summary:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: -3px;
        }
        .signal-history-content { padding: 0 15px 15px; }
        .signal-history-empty,
        .signal-history-start {
            color: var(--secondary);
            font-size: 12px;
            line-height: 1.4;
        }
        .signal-history-start { margin: 12px 0 0; }
        .signal-history-event {
            border-top: 1px solid #2c2c2e;
            padding: 0;
        }
        .signal-history-event summary {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 3px 10px;
            padding: 11px 0;
            cursor: pointer;
            list-style: none;
        }
        .signal-history-event summary::-webkit-details-marker { display: none; }
        .signal-history-event-date { color: var(--secondary); font-size: 11px; font-weight: 800; }
        .signal-history-event-chevron { color: var(--blue); font-size: 12px; }
        .signal-history-event-setup { font-size: 13px; font-weight: 900; overflow-wrap: anywhere; }
        .signal-history-event-status {
            grid-column: 1 / -1;
            color: var(--secondary);
            font-size: 12px;
            line-height: 1.35;
            overflow-wrap: anywhere;
        }
        .signal-history-event[open] .signal-history-event-chevron { transform: rotate(90deg); }
        .signal-history-details {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 9px 12px;
            padding: 0 0 13px;
        }
        .signal-history-detail-label {
            display: block;
            color: var(--secondary);
            font-size: 10px;
            font-weight: 800;
            line-height: 1.2;
            text-transform: uppercase;
        }
        .signal-history-detail-value {
            display: block;
            margin-top: 2px;
            font-size: 12px;
            font-weight: 750;
            line-height: 1.3;
            overflow-wrap: anywhere;
        }
        .signal-history-changes {
            border-top: 1px solid #2c2c2e;
            margin: 0 0 13px;
            padding-top: 10px;
        }
        .signal-history-changes-title {
            color: var(--secondary);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: .5px;
            text-transform: uppercase;
        }
        .signal-history-change { margin-top: 8px; }
        .signal-history-change-date { color: var(--secondary); font-size: 11px; font-weight: 800; }
        .signal-history-change-text { font-size: 12px; line-height: 1.35; margin-top: 2px; }
        .charts-wrapper {
            background: var(--card);
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .chart-price-container {
            position: relative;
            height: min(46vh, 340px);
            min-height: 220px;
        }
        .chart-rsi-container {
            position: relative;
            height: min(26vh, 180px);
            min-height: 130px;
        }
        .chart-price-container canvas,
        .chart-rsi-container canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .info-box { background: var(--card); padding: 15px; border-radius: 15px; }
        .muted-mini { font-size: 11px; color: var(--secondary); font-weight: 600; margin-top: 4px; }
        .score-explanation, .classification-explanations {
            background: var(--card);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 18px;
            border: 1px solid #2c2c2e;
        }
        .score-explanation-title { font-size: 14px; font-weight: 900; margin-bottom: 8px; }
        .score-explanation-summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
        .score-explanation-score { font-size: 20px; font-weight: 900; }
        .score-explanation-version { font-size: 10px; color: var(--secondary); font-weight: 700; text-align: right; overflow-wrap: anywhere; }
        .score-disclaimer { font-size: 12px; color: var(--secondary); line-height: 1.4; margin: 10px 0; }
        .score-explanation details { border-top: 1px solid #2c2c2e; padding-top: 10px; }
        .score-explanation summary { cursor: pointer; color: var(--blue); font-size: 12px; font-weight: 800; }
        .score-breakdown { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        .score-breakdown th { color: var(--secondary); font-size: 10px; text-align: left; text-transform: uppercase; }
        .score-breakdown th:last-child, .score-breakdown td:last-child { text-align: right; white-space: nowrap; }
        .score-breakdown td { padding: 8px 0; border-bottom: 1px solid #2c2c2e; vertical-align: top; }
        .score-breakdown tr:last-child td { border-bottom: none; }
        .score-breakdown-reason { display: block; color: var(--secondary); line-height: 1.35; margin-top: 3px; }
        .score-adjustments-title { color: var(--secondary); font-size: 10px; font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; margin: 12px 0 2px; }
        .classification-explanations-title { font-size: 10px; color: var(--secondary); font-weight: 900; letter-spacing: 0.6px; text-transform: uppercase; margin-bottom: 10px; }
        .classification-explanation { padding: 10px 0; border-bottom: 1px solid #2c2c2e; }
        .classification-explanation:last-child { border-bottom: none; padding-bottom: 0; }
        .classification-explanation-head { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; font-weight: 900; }
        .classification-explanation-value { color: var(--blue); text-align: right; overflow-wrap: anywhere; }
        .classification-explanation-reason { color: var(--secondary); font-size: 12px; line-height: 1.35; margin-top: 5px; }
        .classification-explanation-facts { color: var(--secondary); font-size: 11px; line-height: 1.35; margin: 6px 0 0; padding-left: 16px; }
        .score-explanation-unavailable { color: var(--secondary); font-size: 12px; margin-top: 8px; }

        .company-meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 12px; }
        .company-meta-item { background: var(--card); border-radius: 8px; color: var(--secondary); font-size: 11px; font-weight: 600; padding: 5px 8px; }
        .detail-main-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 16px;
            margin: 0 0 14px;
            padding: 0 2px;
        }
        .detail-main-ticker {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 25px;
            font-weight: 900;
        }
        .detail-main-price {
            flex-shrink: 0;
            font-size: 26px;
            font-weight: 900;
            text-align: right;
            white-space: nowrap;
        }
        .detail-main-currency {
            color: var(--secondary);
            font-size: 14px;
            font-weight: 700;
        }
        .company-info-card {
            background: var(--card);
            border: 1px solid #2c2c2e;
            border-radius: 15px;
            padding: 15px;
            margin: 0 0 10px;
        }
        .company-info-title {
            color: var(--secondary);
            font-size: 10px;
            font-weight: 900;
            letter-spacing: 0.6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .company-info-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #2c2c2e;
            font-size: 13px;
        }
        .company-info-row:last-child { border-bottom: 0; }
        .company-info-row span:first-child { color: var(--secondary); }
        .company-info-row span:last-child {
            font-weight: 800;
            overflow-wrap: anywhere;
            text-align: right;
        }
        @media (max-width: 430px) {
            .detail-main-ticker { font-size: 22px; }
            .detail-main-price { font-size: 23px; }
        }

        /* 3-lags signalboks */
        .signal-box {
            background: var(--card);
            border-radius: 15px;
            padding: 14px 15px;
            margin-bottom: 18px;
            border: 1px solid #2c2c2e;
        }
        .signal-title {
            font-size: 10px;
            color: var(--secondary);

<script>
    let allStocks = []; let stocks = []; let currentSort = 'ticker'; let isAscending = true; let currentFilter = 'all'; let currentSector = '';
    let activeSignalPreset = '';
    let overviewScrollPosition = 0;

    // En ødelagt localStorage-verdi skal ikke hindre resten av appen i å starte.
    function readLocalStorageJson(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch (_) {
            localStorage.removeItem(key);
            return fallback;
        }
    }

    let myStocks = readLocalStorageJson('myStocks', []);
    let radarStocks = readLocalStorageJson('radarStocks', []);
    let myGAVs = readLocalStorageJson('myGAVs', {});
    let myNotes = readLocalStorageJson('myNotes', {});
    let rsiAlerts = readLocalStorageJson('rsiAlerts', {});
    let rsiAlertState = readLocalStorageJson('rsiAlertState', {});
    let priceChart = null; let rsiChart = null;
    let currentTicker = null;
    let currentChartPeriod = 30;
    let signalHistoryFrom = '';

    const tooltips = {
        rsi: "<b>RSI (14):</b> 30=Oversolgt, 70=Overkjøpt. De hvite linjene markerer faresonene.",
        volum: "<b>Volum %:</b> Dagens volum mot 20-dagers snittvolum.",
        rr: "<b>Risk/Reward:</b> Oppside mot nedside basert på 50-dagers støtte/motstand.",
        trend: "<b>Trend:</b> Backend kombinerer pris vs SMA200, SMA50 vs SMA200 og MACD.",
        atr: "<b>ATR %:</b> Volatilitet relativt til kurs. Nyttig for stop-loss og posisjonsstørrelse.",
        rs: "<b>RS 3M:</b> Relativ styrke siste 3 måneder mot OSEBX.",
        sma: "<b>SMA:</b> Glidende snitt (20/50/200).",
        ema: "<b>EMA:</b> Eksponentielt snitt (9/20/200).",
        support: "<b>Støtte/Motstand:</b> 50-dagers lav/høy brukes som proxy for støtte/motstand.",
        macd: "<b>MACD:</b> MACD-linje, signallinje og histogram. Histogram over null betyr at MACD ligger over signal.",
        ret: "<b>Avkastning:</b> Prosentvis utvikling over faste perioder.",
        high52: "<b>52-ukers nivåer:</b> Viser hvor nær aksjen er års-høy og års-lav."
    };

    // ✅ Bruk alltid "latest raw" for gist (slipper å oppdatere hash)
    const DATA_URL = "https://gist.githubusercontent.com/gullesen/28b92c3d60b920d4ae061dd73d6a5570/raw/aksjer.json?t=" + Date.now();

    // ----------------------------
    // 3-LAGS SIGNALER: TREND / SETUP / RISIKO (forbedret)
    // ----------------------------

    function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

    function safeNum(v, fallback) {
        const n = Number(v);
        return Number.isFinite(n) ? n : fallback;
    }

    // Data fra Gist og localStorage skal alltid behandles som tekst når de vises i HTML.
    // Hardkodet innhold (som tooltips) kan fortsatt bruke bevisst formatering.
    function escapeHtml(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
        })[char]);
    }

    function pctDiff(a, b) {
        // (a-b)/b
        if (!Number.isFinite(a) || !Number.isFinite(b) || b === 0) return 999;
        return (a - b) / b;
    }

    function getHistory(s, n) {
        if (!s?.Historikk || !Array.isArray(s.Historikk)) return [];
        return s.Historikk.slice(-n);
    }

    function getLastCloseFromHistory(s) {
        const h = getHistory(s, 1);
        if (!h.length) return NaN;
        return safeNum(h[0].close, NaN);
    }

    function getLastPrice(s) {
        const sc = safeNum(s?.["Siste kurs"], NaN);
        return Number.isFinite(sc) ? sc : getLastCloseFromHistory(s);
    }

    function trendSignal(s) {
        const price = getLastPrice(s);
        const sma50 = safeNum(s?.SMA_50, NaN);
        const sma200 = safeNum(s?.SMA_200, NaN);
        const macdTrend = (s?.MACD_Trend || '').toString();

        const above200 = Number.isFinite(price) && Number.isFinite(sma200) ? price > sma200 : false;
        const below200 = Number.isFinite(price) && Number.isFinite(sma200) ? price < sma200 : false;
        const crossUp  = Number.isFinite(sma50) && Number.isFinite(sma200) ? sma50 > sma200 : false;
        const crossDn  = Number.isFinite(sma50) && Number.isFinite(sma200) ? sma50 < sma200 : false;

        let bullPts = 0, bearPts = 0;
        if (above200) bullPts++;
        if (crossUp) bullPts++;
        if (macdTrend === 'Bull') bullPts++;

        if (below200) bearPts++;
        if (crossDn) bearPts++;
        if (macdTrend === 'Bear') bearPts++;

        if (bullPts >= 2 && bullPts > bearPts) {
            const bits = [
                above200 ? "Pris > SMA200" : null,
                crossUp ? "SMA50 > SMA200" : null,
                macdTrend === "Bull" ? "MACD Bull" : null
            ].filter(Boolean).join(" · ");
            return { label: 'OPPTREND', icon: '🟢', color: 'var(--green)', reason: bits || 'Positivt trendregime' };
        }
        if (bearPts >= 2 && bearPts > bullPts) {
            const bits = [
                below200 ? "Pris < SMA200" : null,
                crossDn ? "SMA50 < SMA200" : null,
                macdTrend === "Bear" ? "MACD Bear" : null
            ].filter(Boolean).join(" · ");
            return { label: 'NEDTREND', icon: '🔴', color: 'var(--red)', reason: bits || 'Negativt trendregime' };
        }
        return { label: 'RANGE / UKLART', icon: '🟡', color: 'var(--yellow)', reason: `Blandet bilde (SMA/MACD)` };
    }

    // Prioritet: Support bounce -> Pullback i opptrend -> Breakout -> Ingen setup
    function setupSignal(s, trend) {
        const price = getLastPrice(s);
        const support = safeNum(s?.Support_50, NaN);
        const resist  = safeNum(s?.Resistance_50, NaN);
        const vol = safeNum(s?.Volum_vs_Snitt, 100);
        const rr  = safeNum(s?.Risk_Reward, NaN);
        const rsi = safeNum(s?.RSI_14, 50);

        const h = getHistory(s, 12);
        const closes = h.map(x => safeNum(x.close, NaN)).filter(Number.isFinite);
        const rsis   = h.map(x => safeNum(x.rsi, NaN)).filter(Number.isFinite);

        // A) SUPPORT BOUNCE
        if (Number.isFinite(price) && Number.isFinite(support) && closes.length >= 3) {
            const lookback = Math.min(closes.length, 8);
            const recent = closes.slice(-lookback);
            const recentMin = Math.min(...recent);
            const nearSupport = recentMin <= support * 1.02;

            const last = recent[recent.length - 1];
            const prev = recent[recent.length - 2];
            const prev2 = recent.length >= 3 ? recent[recent.length - 3] : prev;

            const priceUp1 = (last > prev);
            const priceUp2 = (last > prev && prev > prev2);

            let rsiUp = false;
            if (rsis.length >= 2) {
                rsiUp = rsis[rsis.length - 1] > rsis[rsis.length - 2];
            }

            const bounce = nearSupport && (priceUp1 || priceUp2 || rsiUp);
            if (bounce) {
                const vtxt = Number.isFinite(vol) ? `${vol.toFixed(0)}%` : '–';
                const rrtxt = Number.isFinite(rr) ? rr.toFixed(2) : '–';
                return {
                    label: 'SUPPORT BOUNCE',
                    icon: '🟢',
                    color: 'var(--green)',
                    reason: `Testet støtte · Vending bekreftet · Vol ${vtxt} · R/R ${rrtxt}`
                };
            }
        }

        // B) PULLBACK I OPPTREND
        const ema20 = safeNum(s?.EMA_20, NaN);
        const sma50 = safeNum(s?.SMA_50, NaN);

        if (trend.label === 'OPPTREND' && Number.isFinite(price)) {
            const nearEma20 = Number.isFinite(ema20) ? Math.abs(pctDiff(price, ema20)) <= 0.02 : false;
            const nearSma50 = Number.isFinite(sma50) ? Math.abs(pctDiff(price, sma50)) <= 0.02 : false;
            const okRsi = rsi <= 68;

            if ((nearEma20 || nearSma50) && okRsi) {
                const targetRef = nearEma20 ? 'EMA20' : 'SMA50';
                return {
                    label: 'PULLBACK (TREND)',
                    icon: '🟡',
                    color: 'var(--yellow)',
                    reason: `Opptrend · Pullback nær ${targetRef} · RSI ${rsi.toFixed(0)}`
                };
            }
        }

        // C) BREAKOUT / MOMENTUM
        if (Number.isFinite(price) && Number.isFinite(resist)) {
            const breakout = price >= resist * 0.998 && vol >= 120;
            if (breakout) {
                return {
                    label: 'BREAKOUT',
                    icon: '🟡',
                    color: 'var(--yellow)',
                    reason: `Brudd motstand · Vol ${vol.toFixed(0)}%`
                };
            }
        }

        return {
            label: 'INGEN SETUP',
            icon: '⚪️',
            color: 'var(--secondary)',
            reason: `Ingen tydelig støtte-bounce / pullback / breakout nå`
        };
    }

    function riskSignal(s, trend, setup) {
        const rsi = safeNum(s?.RSI_14, 50);
        const rr  = safeNum(s?.Risk_Reward, NaN);
        const vol = safeNum(s?.Volum_vs_Snitt, 100);

        const reasons = [];

        // Overkjøpt / overstretched
        if (rsi >= 75) reasons.push(`RSI ${rsi.toFixed(0)} svært høy`);
        else if (rsi >= 70) reasons.push(`RSI ${rsi.toFixed(0)} overkjøpt`);

        // Lav R/R
        if (Number.isFinite(rr) && rr < 1.0) reasons.push(`Lav R/R (${rr.toFixed(2)})`);

        // Svak volumstøtte
        if (vol < 80) reasons.push(`Svak volumstøtte (${vol.toFixed(0)}%)`);

        // Ekstremt lav RSI
        if (rsi <= 25) reasons.push(`RSI ${rsi.toFixed(0)} ekstremt lav`);

        let level = 'LAV';
        let icon = '🟢';
        let color = 'var(--green)';

        const inDowntrend = trend.label === 'NEDTREND';
        const inUptrend = trend.label === 'OPPTREND';

        const highRisk = (
            (rsi >= 75) ||
            (inDowntrend && setup.label === 'INGEN SETUP') ||
            (rsi >= 70 && !inUptrend)
        );

        const mediumRisk = (
            reasons.length >= 1 ||
            (inDowntrend && setup.label !== 'SUPPORT BOUNCE') ||
            (!inUptrend && Number.isFinite(rr) && rr < 1.2)
        );

        if (highRisk) {
            level = 'HØY'; icon = '🔴'; color = 'var(--red)';
        } else if (mediumRisk) {
            level = 'MIDDELS'; icon = '🟡'; color = 'var(--yellow)';
        }

        return {
            label: level,
            icon,
            color,
            reason: reasons.length ? reasons.join(' · ') : `Ingen klare røde flagg`
        };
    }

    function computeThreeSignals(s) {
        const backendTrend = s?.Trend_Signal;
        const backendSetup = s?.Setup_Signal;
        const backendRisk = s?.Risk_Signal;

        if (backendTrend && backendSetup && backendRisk) {
            const mk = (label, reason, icon) => ({
                label,
                reason: reason || '',
                icon: icon || miniDot({icon}).icon,
                color: icon === '🔴' ? 'var(--red)' : icon === '🟡' ? 'var(--yellow)' : 'var(--green)'
            });
            return {
                trend: mk(backendTrend, s?.Trend_Reason, s?.Trend_Icon),
                setup: mk(backendSetup, s?.Setup_Reason, s?.Setup_Icon),
                risk: mk(backendRisk, s?.Risk_Reason, s?.Risk_Icon),
            };
        }

        const trend = trendSignal(s);
        const setup = setupSignal(s, trend);
        const risk  = riskSignal(s, trend, setup);
        return { trend, setup, risk };
    }

    // Mini-ikoner til liste (3-lag)
    function miniDot(sigObj) {
        if (sigObj.icon === '🔴') return { icon:'🔴', color:'var(--red)' };
        if (sigObj.icon === '🟢') return { icon:'🟢', color:'var(--green)' };
        if (sigObj.icon === '🟡') return { icon:'🟡', color:'var(--yellow)' };
        return { icon:'⚪️', color:'var(--secondary)' };
    }

    function getPerfForDays(stock, days) {
        if (!stock || !Array.isArray(stock.Historikk) || stock.Historikk.length < (days + 1)) return NaN;
        const start = safeNum(stock.Historikk[stock.Historikk.length - (days + 1)]?.close, NaN);
        const last = getLastPrice(stock);
        if (!Number.isFinite(start) || !Number.isFinite(last) || start === 0) return NaN;
        return ((last - start) / start) * 100;
    }

    function getRelativeStrength3M(stock, indexStock) {
        const backend = normNumber(stock?.RS_3m_vs_OSEBX, NaN);
        if (Number.isFinite(backend)) return backend;

        if (!stock || !indexStock || !Array.isArray(stock.Historikk) || !Array.isArray(indexStock.Historikk)) return NaN;
        const maxDaysStock = Math.max(0, stock.Historikk.length - 1);
        const maxDaysIndex = Math.max(0, indexStock.Historikk.length - 1);
        const days = Math.min(60, maxDaysStock, maxDaysIndex);
        if (days < 20) return NaN;

        const stockPerf = getPerfForDays(stock, days);
        const indexPerf = getPerfForDays(indexStock, days);
        if (!Number.isFinite(stockPerf) || !Number.isFinite(indexPerf)) return NaN;
        return stockPerf - indexPerf;
    }

    function pickBenchmarkStock(list) {
        if (!Array.isArray(list) || !list.length) return null;

        const preferred = list.find(x => x?.Aksje === "OSEBX.OL" && Array.isArray(x?.Historikk) && x.Historikk.length >= 21);
        if (preferred) return preferred;

        // Fallback: velg papiret med lengst historikk slik at relativ styrke kan beregnes for flest mulig.
        const withHistory = list
            .filter(x => Array.isArray(x?.Historikk) && x.Historikk.length >= 21)
            .sort((a, b) => b.Historikk.length - a.Historikk.length);
        return withHistory[0] || null;
    }

    function getCompositeLabel(score) {
        if (score >= 9) return { label: 'Sterk', color: 'var(--green)', bg: 'rgba(50,215,75,0.2)' };
        if (score >= 5) return { label: 'Nøytral', color: 'var(--yellow)', bg: 'rgba(255,214,10,0.2)' };
        return { label: 'Svak', color: 'var(--red)', bg: 'rgba(255,69,58,0.2)' };
    }

    function computeCompositeScore(stock, indexStock) {
        const backend = getBackendComposite(stock);
        if (backend) return backend;

        const rsi = safeNum(stock?.RSI_14, NaN);
        const price = getLastPrice(stock);
        const sma50 = safeNum(stock?.SMA_50, NaN);
        const sma200 = safeNum(stock?.SMA_200, NaN);
        const relStrength3M = getRelativeStrength3M(stock, indexStock);
        const macdTrend = (stock?.MACD_Trend || '').toString().trim().toLowerCase();

        const hasRequiredData = Number.isFinite(rsi)
            && Number.isFinite(price)
            && Number.isFinite(sma50)
            && Number.isFinite(sma200)
            && Number.isFinite(relStrength3M)
            && !!macdTrend;

        if (!hasRequiredData) return null;

        let score = 0;
        if (relStrength3M > 0) score += 3;
        if (price > sma50) score += 2;
        if (sma50 > sma200) score += 2;

        const trendStrength = (price - sma50) / sma50;
        if (trendStrength > 0.10) score += 2;
        else if (trendStrength >= 0.03) score += 1;

        if (rsi >= 45 && rsi <= 65) score += 2;
        if (macdTrend === 'bull') score += 1;

        return {
            score,
            maxScore: 12,
            classification: getCompositeLabel(score)
        };
    }

        }

    function normNumber(v, fallback = NaN) {
        if (typeof v === 'string') {
            const normalized = v.replace(',', '.').replace(/\s/g, '');
            const n = Number(normalized);
            return Number.isFinite(n) ? n : fallback;
        }
        const n = Number(v);
        return Number.isFinite(n) ? n : fallback;
    }

    function optionalFilterNumber(value) {
        return String(value ?? '').trim() === '' ? NaN : normNumber(value, NaN);

    function fmt(v, digits = 1, suffix = '') {

    function isValidLevelNumber(value) {

    function getZoneLevel(stock, key) {
        const low = normNumber(stock?.[`${key}_Low`], NaN);
        const high = normNumber(stock?.[`${key}_High`], NaN);
        const hasLow = Number.isFinite(low) && low !== 0;
        const hasHigh = Number.isFinite(high) && high !== 0;
        if (!hasLow && !hasHigh) return null;
        const lower = hasLow ? low : high;
        const upper = hasHigh ? high : low;
        return {
            low: Math.min(lower, upper),
            high: Math.max(lower, upper)
        };
    }

    function formatPriceZone(lower, upper) {
        const low = normNumber(lower, NaN);
        const high = normNumber(upper, NaN);
        if (!Number.isFinite(low) && !Number.isFinite(high)) return '—';
        if (!Number.isFinite(low)) return numberOrDash(high, 1);
        if (!Number.isFinite(high)) return numberOrDash(low, 1);
        const lowText = numberOrDash(low, 1);
        const highText = numberOrDash(high, 1);
        return lowText === highText ? lowText : `${lowText}&ndash;${highText}`;
    }

    function buildZoneText(level) {
        return level ? formatPriceZone(level.low, level.high) : '';
    }

        const nextSupport = isAllTimeLow ? null : getZoneLevel(stock, 'Support_1');
        const secondarySupport = isAllTimeLow ? null : getZoneLevel(stock, 'Support_2');
        const secondaryResistance = isAllTimeHigh ? null : getZoneLevel(stock, 'Resistance_2');

        const levels = [
            {
                label: 'Neste motstand',
                type: 'resistance',

                data: nextResistance,
                fallbackText: nextResistance ? '' : 'Ingen motstand',

            },

        const body = levels.length

            </div>
        `;

    function getSignalView(s, indexStock) { const model=getSignalModel(s), strength=getStrength(s,indexStock); if (!model) { const legacy=computeThreeSignals(s); return {model:null,strength,trend:{label:legacy.trend.label,code:legacy.trend.label,explanations:[]},setup:{label:legacy.setup.label,code:legacy.setup.label,status:'',age:null,explanations:[]},timing:{label:'',code:'IKKE_VURDERT',explanations:[]},riskReward:{valid:Number.isFinite(normNumber(s?.Risk_Reward,NaN)),value:normNumber(s?.Risk_Reward,NaN),basis:'',legacy:true},alerts:[]}; } const a=k=>model[k]&&typeof model[k]==='object'?model[k]:{}, trend=a('trend'),setup=a('setup'),timing=a('timing'),rr=a('risk_reward'); return {model,strength,trend:{label:signalText(trend.etikett),code:signalText(trend.kode,''),explanations:Array.isArray(trend.forklaringer)?trend.forklaringer:[]},setup:{label:signalText(setup.etikett),code:signalText(setup.kode,''),status:signalText(setup.status,''),age:normNumber(setup.alder_dager,NaN),explanations:Array.isArray(setup.forklaringer)?setup.forklaringer:[]},timing:{label:signalText(timing.etikett),code:signalText(timing.kode,'IKKE_VURDERT'),explanations:Array.isArray(timing.forklaringer)?timing.forklaringer:[]},riskReward:{valid:rr.gyldig===true,value:normNumber(rr.verdi,NaN),entry:normNumber(rr.inngang,NaN),invalidation:normNumber(rr.invalidering,NaN),target1:normNumber(rr.mal_1,NaN),target2:normNumber(rr.mal_2,NaN),basis:signalText(rr.grunnlag,''),legacy:false},alerts:Array.isArray(model.varsler)?model.varsler:[],scenario:a('scenario')}; }
    function timingClass(code) { return ({GOD:'timing-good',MULIG:'timing-possible',AVVENT:'timing-wait',SVAK:'timing-weak'})[String(code).toUpperCase()] || 'timing-none'; }

    function renderScenario(v) { const p=signalText(v.scenario?.positivt,''), n=signalText(v.scenario?.negativt,''); return (p||n)?`<section class="scenario-card"><div class="score-explanation-title">Hva må skje?</div>${p?`<b>Positivt scenario</b><p>${p}</p>`:''}${n?`<b>Negativt scenario</b><p>${n}</p>`:''}</section>`:''; }
    const warnedExplanationItems = new WeakSet();

    function warnUnknownExplanationItem(item) {
        if (!item || typeof item !== 'object' || warnedExplanationItems.has(item)) return;
        warnedExplanationItems.add(item);
        if (typeof console !== 'undefined' && typeof console.warn === 'function') {
            console.warn('Ukjent forklaringsformat', item);
        }
    }

    function formatExplanationItem(item) {
        if (typeof item === 'string' || typeof item === 'number') {
            return explanationText(item);
        }
        if (!item || typeof item !== 'object' || Array.isArray(item)) {
            if (item && typeof item === 'object') warnUnknownExplanationItem(item);
            return '';
        }

        const textField = ['text', 'tekst', 'label', 'beskrivelse', 'description', 'navn']
            .map(key => explanationText(item[key]))
            .find(Boolean);
        const reason = explanationText(item.reason);
        const rawValue = item.verdi ?? item.value ?? item.status;
        const hasPoints = item.points !== undefined && item.points !== null;
        const value = hasPoints
            ? `${formatExplanationPoints(item.points)} poeng`
            : typeof rawValue === 'number'
                ? numberOrDash(rawValue, Number.isInteger(rawValue) ? 0 : 2)
                : explanationText(rawValue);

        if (!textField) {
            if (!reason) warnUnknownExplanationItem(item);
            return reason;
        }
        const suffix = value ? `: ${value}` : '';
        return `${textField}${suffix}${reason ? ` — ${reason}` : ''}`;
    }

    function formatMetadataValue(value) {
        if (typeof value !== 'string' && typeof value !== 'number') return 'Ikke oppgitt';

    }

    function pickDate(h, idx) {
        return h?.dato || h?.date || h?.Date || h?.tid || `P${idx + 1}`;

    function buildFallbackHistory(s, length) {
        const base = normNumber(s?.['Siste kurs'], 100);
        const rsi = normNumber(s?.RSI_14, 50);
        return Array.from({ length }, (_, i) => ({
            dato: `P${i + 1}`,
            open: base,
            high: base,
            low: base,
            close: base,
            rsi
        }));
    }


    function destroyChartOnCanvas(canvasId) {
        if (typeof Chart !== 'function' || typeof Chart.getChart !== 'function') return;
        const existing = Chart.getChart(canvasId);
        if (existing) existing.destroy();
    }

    function drawCanvasFallback(canvasId, values, { min = null, max = null, color = '#0a84ff', extraLines = [] } = {}) {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;

        const width = Math.max(canvas.clientWidth, 200);
        const height = Math.max(canvas.clientHeight, 120);
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#1c1c1e';
        ctx.fillRect(0, 0, width, height);

        const clean = values.map(v => normNumber(v)).filter(Number.isFinite);
        if (!clean.length) return;

        let vMin = Number.isFinite(min) ? min : Math.min(...clean);
        let vMax = Number.isFinite(max) ? max : Math.max(...clean);
        if (vMax <= vMin) { vMax = vMin + 1; }

        const pad = 10;
        const innerW = width - pad * 2;
        const innerH = height - pad * 2;

        ctx.strokeStyle = '#2c2c2e';
        ctx.lineWidth = 1;
        for (const lineVal of extraLines) {
            const y = pad + (1 - (lineVal - vMin) / (vMax - vMin)) * innerH;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(pad, y);
            ctx.lineTo(width - pad, y);
            ctx.stroke();
        }
        ctx.setLineDash([]);

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        values.forEach((raw, i) => {
            const val = normNumber(raw, clean[Math.max(0, i - 1)] ?? clean[0]);
            const x = pad + (i / Math.max(values.length - 1, 1)) * innerW;
            const y = pad + (1 - (val - vMin) / (vMax - vMin)) * innerH;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        });
        ctx.stroke();
    }


    function explanationText(value) {
        if (typeof value !== 'string' && typeof value !== 'number') return '';
        const text = String(value).trim();
        return text ? escapeHtml(text) : '';
    }

    function explanationNumber(value) {
        if (value === null || value === '' || typeof value === 'boolean') return null;
        const number = Number(value);
        return Number.isFinite(number) ? number : null;
    }

    function formatExplanationNumber(value) {
        return Number.isInteger(value) ? String(value) : value.toFixed(2).replace(/\.?0+$/, '');
    }

    function formatExplanationPoints(value) {
        const number = explanationNumber(value);
        if (number === null) return '';
        return `${number > 0 ? '+' : number < 0 ? '−' : ''}${formatExplanationNumber(Math.abs(number))}`;
    }

    function getExplanationItems(items, amountKey) {
        if (!Array.isArray(items)) return [];
        return items.map(item => {
            if (!item || typeof item !== 'object') return null;
            const label = explanationText(item.label) || explanationText(item.key);
            const amount = explanationNumber(item[amountKey]);
            if (!label || amount === null) return null;
            return { label, amount, reason: explanationText(item.reason) };
        }).filter(Boolean);
    }

    function renderExplanationRows(items) {
        return items.map(item => `
            <tr>
                <td>${item.label}${item.reason ? `<span class="score-breakdown-reason">${item.reason}</span>` : ''}</td>
                <td>${formatExplanationPoints(item.amount)}</td>
            </tr>
        `).join('');
    }

    function renderScoreExplanation(stock, composite) {
        const explanation = stock?.ScoreForklaring;
        const hasExplanation = explanation && typeof explanation === 'object' && !Array.isArray(explanation);
        const finalScore = hasExplanation ? explanationNumber(explanation.final_score) : null;
        const displayedScore = finalScore !== null
            ? formatExplanationNumber(finalScore)
            : composite ? `${composite.score}/${composite.maxScore}` : 'N/A';
        const version = hasExplanation ? explanationText(explanation.score_version) : '';
        const components = hasExplanation ? getExplanationItems(explanation.components, 'points') : [];
        const adjustments = hasExplanation ? getExplanationItems(explanation.adjustments, 'amount') : [];
        const breakdown = components.length || adjustments.length;

        return `
            <section class="score-explanation">
                <div class="score-explanation-title">Slik er den tekniske scoren beregnet</div>
                <div class="score-explanation-summary">
                    <span class="score-explanation-score">Composite Score: ${displayedScore}</span>
                    ${version ? `<span class="score-explanation-version">${version}</span>` : ''}
                </div>
                <div class="score-disclaimer">Composite Score er en teknisk rangeringsscore basert på historiske kurs- og volumdata. Den er ikke et kjøpssignal og vurderer ikke selskapskvalitet, verdsettelse, nyheter eller samlet investeringsrisiko.</div>
                ${hasExplanation && breakdown ? `
                    <details>
                        <summary>Se poengbidrag og justeringer</summary>
                        ${components.length ? `<table class="score-breakdown" aria-label="Poengbidrag i Composite Score"><thead><tr><th>Komponent</th><th>Bidrag</th></tr></thead><tbody>${renderExplanationRows(components)}</tbody></table>` : ''}
                        ${adjustments.length ? `<div class="score-adjustments-title">Justeringer</div><table class="score-breakdown" aria-label="Justeringer i Composite Score"><tbody>${renderExplanationRows(adjustments)}</tbody></table>` : ''}
                    </details>` : hasExplanation ? '' : '<div class="score-explanation-unavailable">Detaljert scoreforklaring er ikke tilgjengelig for dette datasettet.</div>'}
            </section>
        `;
    }

    function renderClassificationExplanations(stock) {
        const explanations = stock?.KlassifiseringForklaring;
        if (!explanations || typeof explanations !== 'object' || Array.isArray(explanations)) return '';
        const labels = { trend: 'Trend', setup: 'Setup', risiko: 'Teknisk risiko' };
        const rows = Object.entries(labels).map(([key, label]) => {
            const explanation = explanations[key];
            if (!explanation || typeof explanation !== 'object' || Array.isArray(explanation)) return '';
            const value = explanationText(explanation.value);
            const reason = explanationText(explanation.reason);
            const facts = Array.isArray(explanation.facts)
                ? explanation.facts.map(explanationText).filter(Boolean)
                : [];
            if (!value && !reason && !facts.length) return '';
            return `
                <div class="classification-explanation">
                    <div class="classification-explanation-head"><span>${label}</span>${value ? `<span class="classification-explanation-value">${value}</span>` : ''}</div>
                    ${reason ? `<div class="classification-explanation-reason">${reason}</div>` : ''}
                    ${facts.length ? `<ul class="classification-explanation-facts">${facts.map(fact => `<li>${fact}</li>`).join('')}</ul>` : ''}
                </div>
            `;
        }).filter(Boolean).join('');
        return rows ? `<section class="classification-explanations"><div class="classification-explanations-title">Backendens klassifiseringsforklaringer</div>${rows}</section>` : '';
    }

                plugins: { legend: { display: false } },
                scales: {
                    x: {
                        grid: { display: false },
                        ticks: {
                            color: '#8e8e93',
                            autoSkip: true,
                            maxTicksLimit: 5,
                            font: { size: 10 }
                        }
                    },
                    y: {
                        min: 0,
                        max: 100,
                        grid: { color: '#2c2c2e', lineWidth: 1 },
                        ticks: {
                            stepSize: 10,
                            color: '#8e8e93',
                            callback: (v) => ([0, 30, 50, 70, 100].includes(v) ? v : ''),
                            font: (ctx) => {
                                const v = ctx.tick?.value;
                                return { size: 10, weight: (v === 30 || v === 70) ? 'bold' : 'normal' };
                            }
                        }
                    }
                }
            }
        });

        setTimeout(() => {
            priceChart?.resize();
            rsiChart?.resize();
        }, 0);
    }

    function setSignalFilters() { const state={}; ['min-strength','trend-filter','setup-filter','setup-status-filter','timing-filter','valid-rr-filter','min-rr','min-rs','min-volume'].forEach(id=>state[id]=document.getElementById(id)?.value||''); localStorage.setItem('signalFilters',JSON.stringify(state)); render(); }
    function resetSignalFilters() { activeSignalPreset=''; ['min-strength','trend-filter','setup-filter','setup-status-filter','timing-filter','valid-rr-filter','min-rr','min-rs','min-volume'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';}); setSignalFilters(); }
    function applySignalPreset(name) { resetSignalFilters(); activeSignalPreset=name; const set=(id,v)=>document.getElementById(id).value=v; set('min-strength','8'); if(name==='candidates'){set('timing-filter','GOD_MULIG');set('setup-status-filter','FERSK_AKTIV');set('valid-rr-filter','true');set('min-rr','1.5');} else { const note=document.querySelector('.filter-note'); if(note) note.textContent='Filter: Teknisk radar — styrke minst 8 og Avvent, breakout-forsøk eller etablert opptrend uten fersk/aktiv setup.'; } setSignalFilters(); }
    function restoreSignalFilters() { activeSignalPreset = ''; const state=readLocalStorageJson('signalFilters',{}); Object.entries(state).forEach(([id,value])=>{const el=document.getElementById(id);if(el)el.value=value;}); }

    function normalizeSignalFilterOptions() { const option=document.querySelector('#setup-filter option[value="SUPPORT BOUNCE"]'); if(option) option.value='SUPPORT_BOUNCE'; }
    function configureSignalFilters() {
        const setOptions = (id, options) => {
            const select = document.getElementById(id);
            if (!select) return;
            const selected = select.value;
            select.replaceChildren(...options.map(([value, label]) => new Option(label, value)));
            select.value = options.some(([value]) => value === selected) ? selected : '';
        };
        setOptions('min-strength', [['', 'Alle scorer'], ...Array.from({ length: 12 }, (_, index) => [String(index + 1), `Min. ${index + 1}`])]);
        setOptions('trend-filter', [['', 'Alle trendfaser'], ['ETABLERT_OPPTREND', 'Etablert opptrend'], ['TIDLIG_OPPTREND', 'Tidlig opptrend'], ['SIDELENGS', 'Sidelengs'], ['SVEKKET_TREND', 'Svekket trend'], ['ETABLERT_NEDTREND', 'Etablert nedtrend']]);
        setOptions('setup-filter', [['', 'Alle setup'], ['BREAKOUT_BEKREFTET', 'Bekreftet breakout'], ['BREAKOUT_FORSOK', 'Breakout-forsøk'], ['PULLBACK_OPPTREND', 'Pullback i opptrend'], ['SUPPORT_BOUNCE', 'Support bounce'], ['INGEN_FERSK_SETUP', 'Ingen fersk setup']]);
        setOptions('timing-filter', [['', 'All timing'], ['GOD', 'God'], ['MULIG', 'Mulig'], ['GOD_MULIG', 'God eller mulig'], ['AVVENT', 'Avvent'], ['SVAK', 'Svak']]);
    }


    function formatStockCount(count) {
        return `${count} ${count === 1 ? 'aksje' : 'aksjer'}`;
    }

    function render() {
        const query = document.getElementById('search').value.trim().toLocaleLowerCase();
        updateSortControl();

        let filtered = allStocks.filter(isListableEquity).filter(s =>
            [s.Aksje, s.Navn, s.Sektor]
                .some(value => cleanMetadata(value).toLocaleLowerCase().includes(query))
        );
        if (currentSector) filtered = filtered.filter(s => cleanMetadata(s.Sektor) === currentSector);
        if (currentFilter === 'mine') filtered = filtered.filter(s => myStocks.includes(s.Aksje));
        if (currentFilter === 'radar') filtered = filtered.filter(s => radarStocks.includes(s.Aksje));

        const indexStock = pickBenchmarkStock(stocks);
        if (activeSignalPreset === 'radar') filtered = filtered.filter(s => { const v=getSignalView(s,indexStock); return v.strength.score >= 8 && (v.timing.code === 'AVVENT' || v.setup.code === 'BREAKOUT_FORSOK' || (v.trend.code === 'ETABLERT_OPPTREND' && !['FERSK','AKTIV'].includes(v.setup.status))); });
        const sf=id=>document.getElementById(id)?.value||'', minStrength=optionalFilterNumber(sf('min-strength')), minRr=optionalFilterNumber(sf('min-rr')), minRs=optionalFilterNumber(sf('min-rs')), minVol=optionalFilterNumber(sf('min-volume'));
        filtered = filtered.filter(s => { const v=getSignalView(s,indexStock), rr=v.riskReward; return (!Number.isFinite(minStrength)||v.strength.score>=minStrength) && (!sf('trend-filter')||String(v.trend.code).toUpperCase()===sf('trend-filter')) && (!sf('setup-filter')||String(v.setup.code||v.setup.label).toUpperCase().includes(sf('setup-filter'))) && (!sf('timing-filter')||(sf('timing-filter')==='GOD_MULIG'?['GOD','MULIG'].includes(String(v.timing.code).toUpperCase()):String(v.timing.code).toUpperCase()===sf('timing-filter'))) && (sf('valid-rr-filter')!=='true'||rr.valid) && (!Number.isFinite(minRr)||(rr.valid&&rr.value>=minRr)) && (!Number.isFinite(minRs)||safeNum(s.RS_3m_vs_OSEBX,-Infinity)>=minRs) && (!Number.isFinite(minVol)||safeNum(s.Volum_vs_Snitt,-Infinity)>=minVol); });

        filtered = filtered.filter(s => { const wanted=sf('setup-status-filter'), status=getSignalView(s,indexStock).setup.status; return !wanted || (wanted==='FERSK_AKTIV' ? ['FERSK','AKTIV'].includes(status) : status===wanted); });

        filtered = filtered.filter(s => { const v=getSignalView(s,indexStock), trend=sf('trend-filter'), setup=sf('setup-filter').replace(/ /g,'_'); return (!trend || v.trend.code.includes(trend)) && (!setup || v.setup.code.includes(setup)); });


        const countElement = document.getElementById('visible-stock-count');
        if (countElement) countElement.textContent = formatStockCount(filtered.length);

        filtered.sort((a, b) => {

            let vA, vB;
            if(currentSort === 'score') {
                const scoreA = computeCompositeScore(a, indexStock);
                const scoreB = computeCompositeScore(b, indexStock);
                if (!scoreA && !scoreB) return 0;
                if (!scoreA) return 1;
                if (!scoreB) return -1;
                vA = scoreA.score; vB = scoreB.score;
            }
            else if(currentSort === 'rsi') { vA = safeNum(a.RSI_14, 0); vB = safeNum(b.RSI_14, 0); }
            else if(currentSort === 'volum') { vA = safeNum(a.Volum_vs_Snitt, 0); vB = safeNum(b.Volum_vs_Snitt, 0); }
            else if(currentSort === 'rr') { const aa=getSignalView(a,indexStock).riskReward, bb=getSignalView(b,indexStock).riskReward; vA=aa.valid?aa.value:-Infinity; vB=bb.valid?bb.value:-Infinity; }
            else if(currentSort === 'timing') { const order={GOD:5,MULIG:4,AVVENT:3,SVAK:2,IKKE_VURDERT:1}; vA=order[String(getSignalView(a,indexStock).timing.code).toUpperCase()]||0; vB=order[String(getSignalView(b,indexStock).timing.code).toUpperCase()]||0; }
            else if(currentSort === 'rs') { vA = safeNum(a.RS_3m_vs_OSEBX, -9999); vB = safeNum(b.RS_3m_vs_OSEBX, -9999); }
            else if(currentSort === 'atr') { vA = safeNum(a.ATR_pct, -9999); vB = safeNum(b.ATR_pct, -9999); }
            else { vA = a.Aksje; vB = b.Aksje; }
            return isAscending ? (vA > vB ? 1 : -1) : (vA < vB ? 1 : -1);
        });

        document.getElementById('list').innerHTML = filtered.map(s => {
            const composite = computeCompositeScore(s, indexStock);
            const signalView = getSignalView(s, indexStock);
            const gav = myGAVs[s.Aksje];
            let profitHtml = "";
            if (gav) {
                const diff = ((getLastPrice(s) - gav) / gav) * 100;
                profitHtml = `<span class="profit-badge" style="background:${diff >= 0 ? 'rgba(50,215,75,0.2)' : 'rgba(255,69,58,0.2)'}; color:${diff >= 0 ? 'var(--green)' : 'var(--red)'}">${diff >= 0 ? '+' : ''}${diff.toFixed(1)}%</span>`;
            }

            const rsiVal = safeNum(s.RSI_14, 50);
            const rsiColor = (rsiVal > 70) ? 'var(--red)' : (rsiVal < 30) ? 'var(--green)' : 'var(--text)';

            const sigs = computeThreeSignals(s);
            const tDot = miniDot(sigs.trend);
            const sDot = miniDot(sigs.setup);
            const rDot = miniDot(sigs.risk);

            return `<div class="stock-card" onclick="openDetail('${s.Aksje}')">
                <div class="row-top">
                    <div class="stock-card-main" style="display:flex; flex-direction:column;">
                        <span class="ticker"><span class="ticker-symbol">${s.Navn || s.Aksje}</span>${profitHtml}
                            <span class="score-badge" style="background:#3a3a3c; color:var(--blue);">${signalView.strength.score === null ? '—' : `${signalView.strength.score}/${signalView.strength.max}`}</span>
                        </span>
                        <span class="stock-name-row">
                            ${myStocks.includes(s.Aksje) ? '<span class="list-badge">MINE</span>' : radarStocks.includes(s.Aksje) ? '<span class="list-badge radar">RADAR</span>' : ''}
                            <span class="stock-name">${s.Aksje}</span>
                        </span>
                    </div>
                        <span class="compact-signal" aria-label="Signal: ${signalView.strength.score === null ? 'ikke vurdert' : `${signalView.strength.score}/${signalView.strength.max}`} · ${signalView.timing.label || 'ikke vurdert'} · ${signalView.setup.label}">${signalView.strength.score === null ? '—' : `${signalView.strength.score}/${signalView.strength.max}`} · ${signalView.timing.label || '—'}${signalView.setup.label ? ` · ${signalView.setup.label}` : ''}</span>
                    <span class="price">
                        <span class="triple-icons" title="T = Trend · S = Setup · R = Risiko" aria-label="T = Trend, S = Setup, R = Risiko">
                            <span class="signal-mini"><span class="signal-mini-label">T</span><span class="sig-dot" style="color:${tDot.color};">${tDot.icon}</span></span>
                            <span class="signal-mini"><span class="signal-mini-label">S</span><span class="sig-dot" style="color:${sDot.color};">${sDot.icon}</span></span>
                            <span class="signal-mini"><span class="signal-mini-label">R</span><span class="sig-dot" style="color:${rDot.color};">${rDot.icon}</span></span>
                        </span>
                        ${Number(getLastPrice(s)).toFixed(2)}
                    </span>
                </div>
                <div class="row-indicators">
                    <div class="mini-stat"><span class="label">RSI</span><span class="val" style="color:${rsiColor};">${rsiVal.toFixed(0)}</span></div>
                    <div class="mini-stat"><span class="label">VOL %</span><span class="val">${fmt(s.Volum_vs_Snitt, 0, '%')}</span></div>
                    <div class="mini-stat"><span class="label">RS 3M</span><span class="val" style="color:${safeNum(s.RS_3m_vs_OSEBX, 0) >= 0 ? 'var(--green)' : 'var(--red)'}">${fmt(s.RS_3m_vs_OSEBX, 1, '%')}</span></div>
                    <div class="mini-stat"><span class="label">ATR %</span><span class="val">${fmt(s.ATR_pct, 1, '%')}</span></div>
                    <div class="mini-stat"><span class="label">R/R</span><span class="val">${signalView.riskReward.valid ? numberOrDash(signalView.riskReward.value, 1) : "—"}</span></div>
                </div>
            </div>`;
        }).join('');
    }

    function toggleList(ticker, type) {
        if (!isCandidate(stocks.find(s => s.Aksje === ticker))) return;
        let list = type === 'mine' ? myStocks : radarStocks;
        let other = type === 'mine' ? radarStocks : myStocks;
        const idx = list.indexOf(ticker);
        if (idx > -1) list.splice(idx, 1);
        else {
            list.push(ticker);
            const oIdx = other.indexOf(ticker);
            if(oIdx > -1) other.splice(oIdx, 1);
        }
        localStorage.setItem('myStocks', JSON.stringify(myStocks));
        localStorage.setItem('radarStocks', JSON.stringify(radarStocks));
        openDetail(ticker);
        render();
    }

    function saveData(ticker, field, val) {
        if (!isCandidate(stocks.find(s => s.Aksje === ticker))) return;
        if (field === 'gav') {
            if (!val || val == 0) delete myGAVs[ticker];
            else myGAVs[ticker] = parseFloat(val);
            localStorage.setItem('myGAVs', JSON.stringify(myGAVs));
        } else {
            if (!val) delete myNotes[ticker];
            else myNotes[ticker] = val;
            localStorage.setItem('myNotes', JSON.stringify(myNotes));
        }
        render();
    }

    function getNotificationPermissionState() {
        if (typeof Notification === 'undefined') return 'unsupported';
        return Notification.permission;
    }

    async function requestNotificationPermission() {
        if (typeof Notification === 'undefined') return;
        try {
            await Notification.requestPermission();
            if (currentTicker) {
                openDetail(currentTicker);
                if (document.getElementById('alertPage').style.display === 'block') openAlerts(currentTicker);
            }
        } catch (_) {}
    }

    function getRsiAlertConfig(ticker) {
        const raw = rsiAlerts[ticker];
        if (Number.isFinite(Number(raw))) return { threshold: Number(raw), direction: 'above' };
        if (raw && typeof raw === 'object') {
            const threshold = Number(raw.threshold);
            const direction = raw.direction === 'below' ? 'below' : 'above';
            if (Number.isFinite(threshold)) return { threshold, direction };
        }
        return { threshold: null, direction: 'above' };
    }

    function saveRsiAlert(ticker, rawValue, rawDirection = 'above', reopenAlertsPage = false) {
        const value = Number(rawValue);
        const direction = rawDirection === 'below' ? 'below' : 'above';
        if (!Number.isFinite(value)) {
            delete rsiAlerts[ticker];
            delete rsiAlertState[ticker];
        } else {
            const threshold = clamp(value, 1, 99);
            rsiAlerts[ticker] = { threshold: Number(threshold.toFixed(1)), direction };
            rsiAlertState[ticker] = { matched: false, direction };
        }
        localStorage.setItem('rsiAlerts', JSON.stringify(rsiAlerts));
        localStorage.setItem('rsiAlertState', JSON.stringify(rsiAlertState));
        if (currentTicker === ticker) {
            openDetail(ticker);
            if (reopenAlertsPage) openAlerts(ticker);
        }
    }

    function evaluateRsiAlerts() {
        const activeTickers = Object.keys(rsiAlerts);
        if (!activeTickers.length || !stocks.length) return;

        let alertsChanged = false;
        activeTickers.forEach((ticker) => {
            const cfg = getRsiAlertConfig(ticker);
            const threshold = Number(cfg.threshold);
            const direction = cfg.direction === 'below' ? 'below' : 'above';
            const stock = stocks.find((x) => x.Aksje === ticker);
            if (!Number.isFinite(threshold) || !stock) return;

            const rsi = safeNum(stock.RSI_14, NaN);
            if (!Number.isFinite(rsi)) return;

            const prevState = rsiAlertState[ticker] || {};
            const isMatch = direction === 'below' ? (rsi <= threshold) : (rsi >= threshold);
            const wasMatch = typeof prevState.matched === 'boolean' ? prevState.matched : isMatch;

            if (!wasMatch && isMatch && getNotificationPermissionState() === 'granted') {
                const transitionTxt = direction === 'below' ? 'falt under' : 'passert over';
                new Notification(`RSI-varsel: ${ticker}`, {
                    body: `RSI ${rsi.toFixed(1)} ${transitionTxt} ${threshold}. Kurs: ${Number(getLastPrice(stock)).toFixed(2)}`,
                    tag: `rsi-alert-${ticker}`
                });
                delete rsiAlerts[ticker];
                delete rsiAlertState[ticker];
                alertsChanged = true;
                return;
            }

            rsiAlertState[ticker] = { matched: isMatch, direction, lastRsi: Number(rsi.toFixed(2)) };
        });

        if (alertsChanged) localStorage.setItem('rsiAlerts', JSON.stringify(rsiAlerts));
        localStorage.setItem('rsiAlertState', JSON.stringify(rsiAlertState));
    }

    function closeAlerts() { document.getElementById('alertPage').style.display = 'none'; }

    function closeDetail() {
        document.getElementById('alertPage').style.display = 'none';
        document.getElementById('detailPage').style.display = 'none';
        document.getElementById('detailPage').scrollTo({ top: 0, left: 0, behavior: 'auto' });
        requestAnimationFrame(() => {
            window.scrollTo({ top: overviewScrollPosition, left: 0, behavior: 'auto' });
        });
        document.getElementById('detail-sticky-name').textContent = '';
        document.getElementById('detail-sticky-price').textContent = '';
    }

    let detailSwipeStart = null;
    const detailPage = document.getElementById('detailPage');
    detailPage.addEventListener('touchstart', event => {
        const touch = event.touches[0];
        detailSwipeStart = touch.clientX <= 32 ? { x: touch.clientX, y: touch.clientY } : null;
    }, { passive: true });
    detailPage.addEventListener('touchend', event => {
        if (!detailSwipeStart) return;
        const touch = event.changedTouches[0];
        const horizontalDistance = touch.clientX - detailSwipeStart.x;
        const verticalDistance = Math.abs(touch.clientY - detailSwipeStart.y);
        detailSwipeStart = null;
        if (horizontalDistance >= 80 && horizontalDistance > verticalDistance * 1.5) {
            closeDetail();
        }
    }, { passive: true });

    function updateHeaderCompactState() {
        const header = document.querySelector('.sticky-header');
        header.classList.toggle('compact', window.scrollY > 100);
    }
    configureSignalFilters();
    window.addEventListener('scroll', updateHeaderCompactState, { passive: true });

    // Start
    restoreSignalFilters();
    load();
    updateSearchClearButton();
    updateHeaderCompactState();
    setInterval(load, 60000);
</script>
